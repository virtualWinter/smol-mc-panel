services:
  panel:
    build: .
    image: smol-mc-panel
    container_name: smol-mc-panel
    restart: unless-stopped
    ports:
      - "5173:5173"
      # Publish the proxy only after switching its bind from 127.0.0.1 to 0.0.0.0
      # in data/servers/proxy/velocity.toml (or config.yml for BungeeCord).
      # - "25565:25565"
    volumes:
      - panel-data:/data
    stop_grace_period: 90s
    environment:
      PANEL_DATA_DIR: /data
      # Dokploy (and docker compose) interpolates these from the deployment's .env.
      PANEL_ORIGIN: ${PANEL_ORIGIN:-}
      PAPERMC_USER_AGENT: ${PAPERMC_USER_AGENT:-}

volumes:
  panel-data:
