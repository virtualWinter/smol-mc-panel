services:
  panel:
    build: .
    image: smol-mc-panel
    container_name: smol-mc-panel
    restart: unless-stopped
    ports:
      - "5173:5173"
      # Minecraft goes through Traefik's TCP routing on Dokploy (a `minecraft`
      # entrypoint on :25565 plus a file-provider router forwarding raw TCP to
      # "smol-mc-panel:25565" — see README). On a plain Docker host without a
      # reverse proxy, uncomment the mapping below instead.
      # - "25565:25565"
    volumes:
      - panel-data:/data
    stop_grace_period: 90s
    env_file:
      - path: ${PANEL_S3_ENV_FILE:-/etc/dokploy/smol-mc-panel/s3.env}
        required: false
    environment:
      PANEL_DATA_DIR: /data
      # Dokploy (and docker compose) interpolates these from the deployment's .env.
      PANEL_ORIGIN: ${PANEL_ORIGIN:-}
      PAPERMC_USER_AGENT: ${PAPERMC_USER_AGENT:-}

volumes:
  panel-data:
